# Local development stack. Production runs the same backend image on AWS EC2,
# with Amazon RDS replacing the "db" service below.
name: vishant-portfolio

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:-portfolio-local-only}@db:5432/portfolio
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      SEED_ON_START: ${SEED_ON_START:-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
